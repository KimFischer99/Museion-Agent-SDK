[build-system]
# >=77 is where PEP 639 landed: an SPDX `license` string and
# `license-files` are only interpreted as such from that version on. The
# repo previously pinned >=68 and used the `license = { file = ... }` table,
# which setuptools now warns is removed by 2027-02.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-sdk"
version = "0.1.2"
description = "Museion Agent SDK: single-profile proactive agent runtime with scheduler, hooks, bounded agent loop, policy, delivery and daemon CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kim Fischer" }]
dependencies = []

[project.optional-dependencies]
# Not required by the test suite (stdlib only). For conformance tooling that
# prefers the reference JSON Schema implementation, install this extra.
schema = ["jsonschema>=4.18"]

[project.scripts]
pas = "proactive_sdk.service:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["proactive_sdk._deployment_reference*"]

[tool.setuptools.package-data]
proactive_sdk = ["py.typed", "migrations/*.sql", "pi_worker/*.ts"]

[tool.setuptools]
include-package-data = false
# Skills are delivered separately in release/skills, never in the runtime wheel.

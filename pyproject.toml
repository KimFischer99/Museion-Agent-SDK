[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-sdk"
version = "0.1.0.dev0"
description = "Proactive personal agent runtime kernel (design name proactive-agent-sdk / PAS). Design-stage package; not yet a published product."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kim Fischer" }]
dependencies = []

[project.optional-dependencies]
# Not required by the test suite (stdlib only). For conformance tooling that
# prefers the reference JSON Schema implementation, install this extra.
schema = ["jsonschema>=4.18"]

[project.scripts]
# Reserved for P7; the CLI does not exist yet. Do not advertise as usable.
pas = "proactive_sdk.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proactive_sdk = ["py.typed", "migrations/*.sql"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proactive-sdk"
version = "0.1.0"
description = "Museion Agent SDK: single-profile proactive agent runtime with scheduler, hooks, bounded agent loop, policy, delivery and daemon CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Kim Fischer" }]
dependencies = []

[project.optional-dependencies]
# Not required by the test suite (stdlib only). For conformance tooling that
# prefers the reference JSON Schema implementation, install this extra.
schema = ["jsonschema>=4.18"]

[project.scripts]
pas = "proactive_sdk.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proactive_sdk = ["py.typed", "migrations/*.sql"]

[tool.setuptools]
# private-vendor/ and any user material live outside src/ and are never
# packaged; tools/package_gate.py verifies the built artifacts anyway.

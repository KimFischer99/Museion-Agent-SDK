# PAS daemon compose example. One profile, one volume, one container.
# Health: the daemon refreshes /var/lib/pas/state/health.json every loop
# pass; the healthcheck reads `ready` out of it (§17.2 readiness).
#
#   docker compose -f deploy/container/docker-compose.yml up -d
#   docker compose ... exec pas pas rpc --method system.health

services:
  pas:
    build:
      context: ../..
      dockerfile: deploy/container/Containerfile
    image: pas-daemon:local
    init: true            # reap children (hook subprocesses) properly
    stop_grace_period: 30s  # >= runtime.shutdown_grace_seconds: drain before KILL
    volumes:
      - pas-state:/var/lib/pas
      # read-only config mount if you do not bake it in:
      # - ./pas.yaml:/var/lib/pas/pas.yaml:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import json, sys
          with open("/var/lib/pas/state/health.json") as f:
              h = json.load(f)
          sys.exit(0 if h.get("ready") else 1)
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  pas-state:
